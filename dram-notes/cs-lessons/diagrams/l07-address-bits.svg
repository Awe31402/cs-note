<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="13" fill="#333333">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A6FA5"/></marker></defs>
<rect width="840" height="380" fill="#ffffff"/>
<text x="420.0" y="20" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#333333" font-weight="bold">9 bit 位址怎麼切（高位 → 低位）</text>
<rect x="100" y="60" width="60" height="40" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="1.2"/>
<text x="130.0" y="50" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">bit 8</text>
<rect x="160" y="60" width="60" height="40" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="1.2"/>
<text x="190.0" y="50" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">bit 7</text>
<rect x="220" y="60" width="60" height="40" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="1.2"/>
<text x="250.0" y="50" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">bit 6</text>
<rect x="100" y="60" width="180" height="40" fill="none" stroke="#333333" stroke-width="2"/>
<text x="190.0" y="116" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#333333" font-weight="bold">row</text>
<text x="190.0" y="134" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">3 bit</text>
<rect x="280" y="60" width="60" height="40" fill="#FEF7E0" stroke="#4A6FA5" stroke-width="1.2"/>
<text x="310.0" y="50" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">bit 5</text>
<rect x="280" y="60" width="60" height="40" fill="none" stroke="#333333" stroke-width="2"/>
<text x="310.0" y="116" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#333333" font-weight="bold">col 高</text>
<text x="310.0" y="134" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">1 bit</text>
<rect x="340" y="60" width="60" height="40" fill="#E6F4EA" stroke="#4A6FA5" stroke-width="1.2"/>
<text x="370.0" y="50" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">bit 4</text>
<rect x="400" y="60" width="60" height="40" fill="#E6F4EA" stroke="#4A6FA5" stroke-width="1.2"/>
<text x="430.0" y="50" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">bit 3</text>
<rect x="460" y="60" width="60" height="40" fill="#E6F4EA" stroke="#4A6FA5" stroke-width="1.2"/>
<text x="490.0" y="50" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">bit 2</text>
<rect x="340" y="60" width="180" height="40" fill="none" stroke="#333333" stroke-width="2"/>
<text x="430.0" y="116" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#333333" font-weight="bold">bank</text>
<text x="430.0" y="134" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">3 bit</text>
<rect x="520" y="60" width="60" height="40" fill="#FCE8E6" stroke="#4A6FA5" stroke-width="1.2"/>
<text x="550.0" y="50" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">bit 1</text>
<rect x="580" y="60" width="60" height="40" fill="#FCE8E6" stroke="#4A6FA5" stroke-width="1.2"/>
<text x="610.0" y="50" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">bit 0</text>
<rect x="520" y="60" width="120" height="40" fill="none" stroke="#333333" stroke-width="2"/>
<text x="580.0" y="116" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#333333" font-weight="bold">col 低</text>
<text x="580.0" y="134" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#777">2 bit</text>
<polyline points="550.0,146 550.0,170 564.0,170" fill="none" stroke="#4A6FA5" stroke-width="1.4" />
<text x="570.0" y="170" font-size="13" text-anchor="start" dominant-baseline="central" fill="#333333">burst 裡的 4 個 column（DIMM 自己數）</text>
<polyline points="400,146 400,205 414,205" fill="none" stroke="#4A6FA5" stroke-width="1.4" />
<text x="420" y="205" font-size="13" text-anchor="start" dominant-baseline="central" fill="#333333">每 4 個位址換一個 bank → interleaving</text>
<polyline points="310.0,146 310.0,240 324.0,240" fill="none" stroke="#4A6FA5" stroke-width="1.4" />
<text x="330.0" y="240" font-size="13" text-anchor="start" dominant-baseline="central" fill="#333333">8 個 bank 輪完一圈，換到 column 4–7</text>
<polyline points="190.0,146 190.0,275 204.0,275" fill="none" stroke="#4A6FA5" stroke-width="1.4" />
<text x="210.0" y="275" font-size="13" text-anchor="start" dominant-baseline="central" fill="#333333">再輪完一圈，才換下一個 row</text>
<text x="420.0" y="325" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#333333">連續的位址：bank0 col0–3 → bank1 col0–3 → … → bank7 col0–3</text>
<text x="420.0" y="349" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#333333">→ bank0 col4–7 → … → bank7 col4–7 → row 1</text>
</svg>
